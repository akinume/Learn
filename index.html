<body class="antialiased">
  <div id="app"></div>
  <dialog oncancel="Learn.closeModal()" id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input id="json-file" onchange="Learn.readImport(this.files[0])" class="sr-only" type="file" accept=".json,application/json" aria-label="Choose a Learn backup">
  <script>
  'use strict';
  (() => {
    const KEY = 'learn.local.v1';
    const icons = {
      home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      cards:'<rect x="5" y="6" width="15" height="15" rx="3"/><path d="M16 3H5a3 3 0 0 0-3 3v10"/>',
      star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>',
      speaker:'<path d="m11 4-6 5H2v6h3l6 5Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',
      arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
      back:'<path d="M19 12H5m6-6-6 6 6 6"/>',
      edit:'<path d="m15 5 4 4M4 20l5-1L21 7a2.8 2.8 0 0 0-4-4L5 15Z"/>',
      trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',
      close:'<path d="m6 6 12 12M6 18 18 6"/>',
      settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/>',
      download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',
      upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      trophy:'<path d="M8 3h8v6a4 4 0 0 1-8 0ZM8 5H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 1v6m-4 2h8"/>',
      moon:'<path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/>',
      sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
      spark:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/>'
    };
    const $ = (s, root = document) => root.querySelector(s);
    const svg = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.cards}</svg>`;
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid = () => typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
    const shuffle = (a) => { a = [...a]; for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
    const tier = n => ['Unseen', 'Still learning', 'Mastered'][n];
    const cardNew = (term='', definition='') => ({id:uid(),term,definition,level:0,starred:false,attempts:0,correct:0});
    const defaults = () => ({version:1,decks:[],settings:{answerWith:'definition',written:true,starredOnly:false,theme:window.matchMedia?.('(prefers-color-scheme: light)').matches?'light':'dark'},session:null});
    let state = defaults(), page = 'home', search = '', editor = null, pendingImport = null, toastTimer, storageIssue = '', corruptRaw = null;
    let storageConflict = false;
    function validateBackup(raw) {
      if (!raw || raw.version !== 1 || !Array.isArray(raw.decks) || raw.decks.length > 200) throw new Error('Choose a version 1 Learn backup with a decks array (up to 200 decks).');
      const ids = new Set(); let total=0;
      const identifier = id => { if(typeof id!=='string'||!id||id.length>100||ids.has(id)) throw new Error('The backup contains missing or duplicate IDs.'); ids.add(id); return id; };
      const text = (v,max,label) => { if(typeof v!=='string'||!v.trim()||v.length>max) throw new Error(`Invalid ${label} in backup.`); return v.trim(); };
      const decks = raw.decks.map(d => {
        if(!d || !Array.isArray(d.cards) || d.cards.length>10000) throw new Error('Each deck must have a cards array, with at most 10,000 cards.');
        total += d.cards.length; if(total>50000) throw new Error('A backup can contain at most 50,000 cards.');
        return {id:identifier(d.id),title:text(d.title,120,'deck title'),description:typeof d.description==='string'?d.description.slice(0,500):'',createdAt:Number.isFinite(d.createdAt)?d.createdAt:Date.now(),updatedAt:Number.isFinite(d.updatedAt)?d.updatedAt:Date.now(),cards:d.cards.map(c => {
          if(!c||![0,1,2].includes(c.level)||typeof c.starred!=='boolean') throw new Error('Invalid card progress in backup.');
          const attempts=Number.isSafeInteger(c.attempts)&&c.attempts>=0?c.attempts:0;
          return {id:identifier(c.id),term:text(c.term,5000,'term'),definition:text(c.definition,5000,'definition'),level:c.level,starred:c.starred,attempts,correct:Number.isSafeInteger(c.correct)&&c.correct>=0?Math.min(c.correct,attempts):0};
        })};
      });
      const s = raw.settings || {};
      return {version:1,decks,settings:{answerWith:s.answerWith==='term'?'term':'definition',written:s.written!==false,starredOnly:s.starredOnly===true,theme:s.theme==='light'?'light':'dark'},session:null};
    }
    function validSession(s) {
      if(!s||typeof s!=='object') return false;
      const d=state.decks.find(d=>d.id===s.deckId); if(!d) return false;
      const ids=new Set(d.cards.map(c=>c.id));
      if(!Array.isArray(s.cardIds)||!s.cardIds.length||!s.cardIds.every(id=>ids.has(id))||new Set(s.cardIds).size!==s.cardIds.length) return false;
      if(!Array.isArray(s.queue)||!s.queue.every(id=>s.cardIds.includes(id))||new Set(s.queue).size!==s.queue.length) return false;
      if(!['question','checkpoint','complete'].includes(s.screen)||!Number.isSafeInteger(s.round)||s.round<1||!Number.isSafeInteger(s.total)||s.total<0||!Number.isSafeInteger(s.hits)||s.hits<0||s.hits>s.total) return false;
      if(!s.options||!['term','definition'].includes(s.options.answerWith)||typeof s.options.written!=='boolean'||typeof s.options.starredOnly!=='boolean') return false;
      if(!Array.isArray(s.results)||s.results.length>7||!s.results.every(r=>r&&ids.has(r.cardId)&&[0,1,2].includes(r.from)&&[0,1,2].includes(r.to)&&typeof r.correct==='boolean'&&typeof r.override==='boolean')) return false;
      if(!s.roundStart||!s.cardIds.every(id=>[0,1,2].includes(s.roundStart[id]))) return false;

    function requeue(id,early) {const s=state.session;s.queue=s.queue.filter(x=>x!==id);const card=deckById(s.deckId).cards.find(c=>c.id===id);if(card.level<2){if(early)s.queue.splice(Math.min(2,s.queue.length),0,id);else s.queue.push(id);}}
    function submitAnswer(value) {
      const s=state.session,q=s?.question;if(page!=='study'||s?.screen!=='question'||!q||q.phase!=='asking')return;
      if(!String(value).trim()){toast('Enter an answer first.');return;}
      const d=deckById(s.deckId),card=d.cards.find(c=>c.id===q.cardId),result=q.type==='written'?grade(value,card[q.answerWith]):{correct:value===card[q.answerWith],typo:false};
      card.attempts++;if(result.correct)card.correct++;card.level=result.correct?Math.min(2,q.from+1):0;d.updatedAt=Date.now();
      s.total++;if(result.correct)s.hits++;
      s.results.push({cardId:card.id,from:q.from,to:card.level,correct:result.correct,override:false});
      q.submitted=value;q.typo=result.typo;q.phase=result.correct?'correct':'incorrect';q.draft='';requeue(card.id,!result.correct);persist();render();
    }
    function override() {
      const s=state.session,q=s?.question;if(!q||q.type!=='written'||q.phase!=='incorrect')return;
      const card=deckById(s.deckId).cards.find(c=>c.id===q.cardId),r=s.results[s.results.length-1];card.level=q.from+1;card.correct++;r.correct=true;r.override=true;r.to=card.level;s.hits++;q.phase='correct';q.overridden=true;requeue(card.id,false);persist();render();
    }
    function advance() {const q=state.session?.question;if(!q||q.phase!=='correct')return;nextQuestion();persist();render();window.scrollTo(0,0);}
    function correction(value) {
      const s=state.session,q=s?.question;if(!q||q.phase!=='incorrect')return;
      const card=deckById(s.deckId).cards.find(c=>c.id===q.cardId);
      if(normalize(value)!==normalize(card[q.answerWith])){const hint=$('#correction-hint');hint.textContent='Copy the correct answer above to reinforce it. Spelling must match; case and punctuation are ignored.';hint.className='small error';$('#correction').setAttribute('aria-invalid','true');$('#correction').focus();return;}
      nextQuestion();persist();render();window.scrollTo(0,0);
    }
    function renderStudy() {
      const s=state.session,d=deckById(s.deckId),cards=scopeCards();
      if(s.screen!=='question')return renderCheckpoint();
      const q=s.question,c=d.cards.find(c=>c.id===q.cardId),answer=c[q.answerWith],prompt=c[q.answerWith==='term'?'definition':'term'];
      const feedback=q.phase==='correct'?`<div class="feedback" role="status"><h3 class="success">${q.overridden?'You know it. Grading updated.':q.typo?'Correct — just a small spelling fix.':q.from===1?'You’ve mastered this one!':'Nice work. One step closer.'}</h3>${q.typo?`<div class="small muted">Exact spelling</div><div class="answer-text">${esc(answer)}</div>`:''}<div class="row spread wrap" style="margin-top:18px"><span class="badge green">${tier(q.from)} → ${tier(c.level)}</span><button onclick="Learn.action(this)" type="button" id="continue" class="btn primary" data-action="continue">Continue ${svg('arrow')}</button></div></div>`:q.phase==='incorrect'?`<div class="feedback" aria-live="polite"><h3 class="error">Let’s give that another look.</h3><div class="small muted">Correct ${q.answerWith}</div><div class="row"><div class="answer-text" style="flex:1">${esc(answer)}</div><button onclick="Learn.action(this)" type="button" class="icon-btn" data-action="speak-answer" aria-label="Read correct answer aloud">${svg('speaker')}</button></div><div id="correction-panel"><label for="correction">Type the correct answer to keep going</label><input id="correction" class="field answer-input" oninput="Learn.captureDraft(this)" value="${esc(q.draft)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="correction-hint" required><p id="correction-hint" class="hint">This card returns to Unseen and will come back soon.</p><div class="row spread wrap" style="margin-top:18px">${q.type==='written'?'<button onclick="Learn.action(this)" class="btn ghost" type="button" data-action="override" title="Alt + R">Override: I was right <kbd>Alt R</kbd></button>':'<span></span>'}<button class="btn primary" type="button" onclick="Learn.checkCorrection()">Check correction ${svg('arrow')}</button></div></div></div>`:'';
      return `<div class="study"><div class="study-header"><div class="row spread"><div class="row" style="min-width:0"><button onclick="Learn.action(this)" type="button" class="icon-btn" data-action="home" aria-label="Back to library">${svg('back')}</button><div><div class="eyebrow" style="margin-bottom:4px">Learn mode${s.options.starredOnly?' · Starred selection':''}</div><h1>${esc(d.title)}</h1></div></div><button onclick="Learn.showOptions()" type="button" class="icon-btn" data-action="options" aria-label="Session options" title="Study options">${svg('settings')}</button></div><div class="round-meta"><span>Round ${s.round} <span style="margin:0 7px">·</span> Question ${Math.min(7,s.results.length+(q.phase==='asking'?1:0))} of 7</span><span>${stats(cards).mastered} / ${cards.length} mastered</span></div><div class="progress-track" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${s.results.length}"><div class="progress-fill" style="width:${s.results.length/7*100}%"></div></div></div><section class="question" aria-label="Study question"><div class="question-top"><div class="row"><span class="badge purple">${q.type==='mc'?'Multiple choice':'Written response'}</span><span class="tiny muted">${tier(q.from)}</span></div><div class="row" style="gap:3px"><button onclick="Learn.action(this)" type="button" class="icon-btn" data-action="speak-prompt" aria-label="Read question aloud" title="Read aloud">${svg('speaker')}</button><button onclick="Learn.action(this)" type="button" class="icon-btn ${c.starred?'starred':''}" data-action="study-star" aria-label="${c.starred?'Unstar':'Star'} this card" aria-pressed="${c.starred}" title="${c.starred?'Unstar':'Star'} card">${svg('star')}</button></div></div><div class="eyebrow" style="color:var(--muted);letter-spacing:1px">${q.answerWith==='term'?'Definition':'Term'}</div><h2 class="prompt">${esc(prompt)}</h2>${q.type==='mc'?`<div class="choices">${q.choices.map((choice,i)=>`<button onclick="Learn.action(this)" type="button" class="choice ${q.phase!=='asking'?(choice===answer?'correct':choice===q.submitted?'wrong':''):''}" data-action="choose" data-index="${i}" ${q.phase==='asking'?'':'disabled'}><span class="key">${i+1}</span><span>${esc(choice)}</span></button>`).join('')}</div>${q.choices.length<4?'<p class="hint">This deck has fewer than four distinct answers, so you’ll see fewer choices. Add cards for more distractors.</p>':''}`:q.phase==='asking'?`<div id="written-panel"><label for="written-answer">Your ${q.answerWith}</label><input id="written-answer" class="field answer-input" oninput="Learn.captureDraft(this)" value="${esc(q.draft)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type what you remember…" required><div class="row spread" style="margin-top:18px"><span class="tiny muted">Meaningful practice, not perfect punctuation.</span><button class="btn primary" type="button" onclick="Learn.checkWritten()">Check answer ${svg('arrow')}</button></div></div>`:`<div class="small muted">Your answer</div><div class="answer-text">${esc(q.submitted)}</div>`}${feedback}</section><div class="study-footer"><span>${q.phase==='asking'?(q.type==='mc'?'<kbd>1</kbd> – <kbd>4</kbd> Choose an answer':'<kbd>Enter</kbd> Check answer'):q.phase==='correct'?'<kbd>Enter</kbd> Continue':'<kbd>Enter</kbd> Check correction'}${q.phase==='incorrect'&&q.type==='written'?' · <kbd>Alt R</kbd> Override':''}</span><span>Progress saves automatically</span></div></div>`;
    }
    function renderCheckpoint() {
      const s=state.session,d=deckById(s.deckId),cards=scopeCards(),complete=cards.every(c=>c.level===2),hits=s.results.filter(r=>r.correct).length,accuracy=s.results.length?Math.round(hits/s.results.length*100):100;
      const leveled=cards.filter(c=>c.level>s.roundStart[c.id]);
      return `<div class="study checkpoint"><div class="row spread" style="margin-bottom:25px"><button onclick="Learn.action(this)" type="button" class="btn ghost" data-action="home">${svg('back')}Library</button><span class="badge purple">${esc(d.title)}${s.options.starredOnly?' · Starred selection':''}</span></div><div class="question"><div class="completion-icon">${svg(complete?'trophy':'spark')}</div><div class="eyebrow">${complete?'Look at you go':'A moment to see your progress'}</div><h1>${complete?'You’ve mastered '+(s.options.starredOnly?'your starred selection.':'this deck.'):'Round '+s.round+' complete.'}</h1><p class="muted">${complete?'Take a breath. That knowledge is yours to keep practicing.':'Every little bit is sticking. Ready for the next seven?'}</p><div class="checkpoint-stats"><div class="checkpoint-stat"><strong class="success">${s.results.length?accuracy+'%':'—'}</strong><span class="tiny muted">Round accuracy</span></div><div class="checkpoint-stat"><strong style="color:var(--accent)">${leveled.length}</strong><span class="tiny muted">Cards leveled up</span></div><div class="checkpoint-stat"><strong>${stats(cards).mastered}<span class="small muted"> / ${cards.length}</span></strong><span class="tiny muted">${s.options.starredOnly?'Selected cards':'Deck cards'} mastered</span></div></div><div style="text-align:left">${progress(d.cards,'Overall deck progress')}${s.options.starredOnly?`<div style="margin-top:15px">${progress(cards,'Starred selection progress')}</div>`:''}</div>${s.results.length?`<div class="results"><div class="result" style="background:var(--panel2)"><strong>This round’s cards</strong><span class="tiny muted">${hits}/${s.results.length} correct${s.results.some(r=>r.override)?' · includes overrides':''}</span></div>${[...new Set(s.results.map(r=>r.cardId))].map(id=>{const c=d.cards.find(c=>c.id===id),from=s.roundStart[id],missed=s.results.some(r=>r.cardId===id&&!r.correct);return `<div class="result"><span class="result-name">${esc(c.term)}${missed?'<span class="tiny muted" style="display:block">Correction practiced this round</span>':''}</span><span class="badge ${c.level>from?'green':''}">${c.level>from?`${tier(from)} → `:''}${tier(c.level)}</span></div>`;}).join('')}</div>`:'<div class="notice">These cards were already mastered. Reset their progress below to practice again.</div>'}<p class="small muted">Session accuracy: ${s.total?Math.round(s.hits/s.total*100)+'% ('+s.hits+'/'+s.total+')':'No questions answered in this session'}. Corrections don’t count as new questions.</p><div class="row wrap" style="justify-content:center;margin-top:25px">${complete?'<button onclick="Learn.action(this)" type="button" class="btn" data-action="reset-selected">Practice again</button><button onclick="Learn.action(this)" type="button" class="btn primary" data-action="finish">Back to library '+svg('check')+'</button>':'<button onclick="Learn.action(this)" type="button" id="next-round" class="btn primary" data-action="next-round">Start round '+(s.round+1)+' '+svg('arrow')+'</button>'}</div></div><p class="hint">${s.options.written?'Unseen → multiple choice → written response → mastered.':'Multiple choice at both tiers. Two correct answers bring a card to mastery.'}</p></div>`;
    }
    function download(text,name,type='application/json') {const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
    function exportBackup() {download(JSON.stringify({version:1,exportedAt:new Date().toISOString(),decks:state.decks,settings:state.settings},null,2),'learn-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('Backup downloaded with decks, stars, and mastery.');}
    function showBackups() {modal('Keep your learning safe',`<div class="modal-body"><p class="muted small">Decks, stars, study options, and mastery are saved in this browser. A JSON backup lets you move them to another browser or keep a copy on your PC.</p><div class="backup-choice"><button onclick="Learn.action(this)" type="button" class="btn" data-action="export">${svg('download')}Export to JSON · Download all ${state.decks.length} decks</button><button onclick="Learn.action(this)" type="button" class="btn" data-action="import">${svg('upload')}Import from JSON · Merge or replace after preview</button></div><p class="hint">Backups include progress, but not the current round. Clearing browser data or moving this HTML file may create a fresh library; keep a backup.</p></div>`, '',true);}
    async function readImport(file) {
      if(!file)return;if(file.size>25*1024*1024){toast('Choose a backup smaller than 25 MB.');return;}
      try {pendingImport=validateBackup(JSON.parse(await file.text()));const count=pendingImport.decks.reduce((n,d)=>n+d.cards.length,0);modal('Your backup is ready',`<div class="modal-body"><p><strong>${pendingImport.decks.length} decks · ${count} cards</strong></p><p class="muted small">Merge adds new decks and updates matching deck IDs from the backup. Replace removes this browser’s current library. Both restore the backup’s study options and keep its mastery and stars.</p><p class="small muted">Import ends the active study session. Export first if you want to preserve your current library.</p><div class="backup-choice"><button onclick="Learn.applyImport(false)" type="button" class="btn" data-action="import-merge">${svg('plus')}Merge into this library</button><button onclick="Learn.action(this)" type="button" class="btn danger" data-action="import-replace">${svg('upload')}Replace this library</button></div></div>`, '',true);}
      catch(e){toast('Import failed: '+e.message);pendingImport=null;}
    }
    function applyImport(replace) {
      if(!pendingImport)return;
      const merged=replace?pendingImport.decks:[...state.decks.filter(d=>!pendingImport.decks.some(n=>n.id===d.id)),...pendingImport.decks];
      let checked;try {checked=validateBackup({version:1,decks:merged,settings:pendingImport.settings});}catch(e){toast('Import failed: '+e.message);return;}
      if(corruptRaw!==null||storageConflict){toast('Resolve the storage warning before importing. Export your current data first.');return;}
      state=checked;page='home';search='';closeModal();const stored=save();render();savedNotice(stored);
    }
    function speak(text) {if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('Text-to-speech is unavailable in this browser.');return;}try {window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.rate=.9;utterance.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))toast('Audio is unavailable. Check your browser’s speech voices.');};window.speechSynthesis.speak(utterance);}catch(e){toast('Could not start audio in this browser.');}}
    function exampleDeck() {const pairs=[['HTML','The markup language used to structure web pages'],['CSS','The language used to style web pages'],['JavaScript','The programming language that adds interactivity to web pages'],['DOM','A tree representation of an HTML document'],['localStorage','Browser storage that persists data across sessions'],['Flexbox','A CSS layout system for arranging items in one dimension'],['Grid','A CSS layout system for arranging items in two dimensions'],['API','An interface that lets software systems communicate']];const now=Date.now();state.decks.unshift({id:uid(),title:'Web essentials',description:'Eight building blocks of the web. A small set for your first lightbulb moment.',createdAt:now,updatedAt:now,cards:pairs.map(p=>cardNew(...p))});persist('Example deck added');render();}
    function action(btn) {
      if(!btn||btn.disabled)return;const a=btn.dataset.action,id=btn.dataset.id;
      if(a==='home'){page='home';render();window.scrollTo(0,0);}
      else if(a==='new')editDeck();
      else if(a==='edit')editDeck(id);
      else if(a==='close-modal')closeModal();
      else if(a==='theme'){state.settings.theme=state.settings.theme==='dark'?'light':'dark';persist();render();}
      else if(a==='options')showOptions();
      else if(a==='backup')showBackups();
      else if(a==='export')exportBackup();
      else if(a==='import'){$('#json-file').value='';$('#json-file').click();}
      else if(a==='import-merge')applyImport(false);
      else if(a==='import-replace') {if(pendingImport){const backup=pendingImport;confirmAction('Replace your library?','Your current decks and progress will be replaced with this backup. This cannot be undone without another backup.','confirm-replace','Replace library');pendingImport=backup;}}
      else if(a==='confirm-replace')applyImport(true);
      else if(a==='example')exampleDeck();
      else if(a==='add-card'){syncEditor();editor.cards.push(cardNew());renderEditor();const rows=document.querySelectorAll('#editor-cards [name=term]');rows[rows.length-1]?.focus();}
      else if(a==='remove-card'){syncEditor();editor.cards=editor.cards.filter(c=>c.id!==id);renderEditor();}
      else if(a==='editor-star'){syncEditor();const c=editor.cards.find(c=>c.id===id);c.starred=!c.starred;btn.classList.toggle('starred',c.starred);btn.setAttribute('aria-pressed',String(c.starred));btn.setAttribute('aria-label',(c.starred?'Unstar':'Star')+' card');}
      else if(a==='bulk-add'){syncEditor();try {const cards=parseBulk(editor.bulk);if(editor.cards.length+cards.length>10000)throw new Error('Limit: 10,000 cards per deck.');editor.cards=editor.cards.filter(c=>c.term.trim()||c.definition.trim()).concat(cards);editor.bulk='';editor.status=`${cards.length} cards added. Review them below, then save your deck.`;editor.statusError=false;}catch(e){editor.status=e.message;editor.statusError=true;}renderEditor();}
      else if(a==='delete'){const d=deckById(id);if(d)confirmAction('Delete this deck?',`“${d.title}” and all its progress will be removed. Export a JSON backup first if you want to keep it.`,`delete-confirm:${id}`,'Delete deck');}
      else if(a.startsWith('delete-confirm:')){const target=a.slice(15);state.decks=state.decks.filter(d=>d.id!==target);if(state.session?.deckId===target)state.session=null;closeModal();page='home';persist('Deck deleted');render();}
      else if(a==='learn'){
        if(state.session?.deckId===id){modal('Continue your learning',`<div class="modal-body"><p class="muted small">You have a saved session for this deck. Resume it, or start fresh with your current study options. Starting fresh keeps card mastery.</p></div>`,`<div class="modal-foot"><button onclick="Learn.action(this)" type="button" class="btn" data-action="restart" data-id="${esc(id)}">New session</button><button onclick="Learn.action(this)" type="button" class="btn primary" data-action="resume">Resume session</button></div>`,true);}
        else if(state.session){confirmAction('Start a new session?','Your card mastery is saved. The other deck’s current round will end.','switch-session:'+id,'Start session');}
        else startSession(id);
      }
      else if(a.startsWith('switch-session:')){closeModal();startSession(a.slice(15));}
      else if(a==='restart'){closeModal();startSession(id);}
      else if(a==='resume'){closeModal();page='study';render();window.scrollTo(0,0);}
      else if(a==='choose')selectChoice(Number(btn.dataset.index));
      else if(a==='continue')advance();
      else if(a==='override')override();
      else if(a==='session-info')showOptions();
      else if(a==='study-star'){const s=state.session,c=deckById(s.deckId).cards.find(c=>c.id===s.question.cardId);c.starred=!c.starred;persist();btn.classList.toggle('starred',c.starred);btn.setAttribute('aria-pressed',String(c.starred));btn.setAttribute('aria-label',(c.starred?'Unstar':'Star')+' this card');btn.title=(c.starred?'Unstar':'Star')+' card';}
      else if(a==='speak-prompt'||a==='speak-answer'){const s=state.session,c=deckById(s.deckId).cards.find(c=>c.id===s.question.cardId);speak(c[a==='speak-answer'?s.question.answerWith:s.question.answerWith==='term'?'definition':'term']);}
      else if(a==='next-round'){const s=state.session;if(s.screen==='question')return;s.round++;s.results=[];s.roundStart=Object.fromEntries(scopeCards().map(c=>[c.id,c.level]));nextQuestion();persist();render();window.scrollTo(0,0);}
      else if(a==='finish'){state.session=null;page='home';persist();render();window.scrollTo(0,0);}
      else if(a==='reset-selected')confirmAction('Practice these cards again?','This resets mastery and answer statistics for the cards in this session. Other cards keep their progress.','confirm-practice','Reset and study');
      else if(a==='confirm-practice'){const s=state.session;for(const c of scopeCards()){c.level=0;c.attempts=0;c.correct=0;}s.queue=shuffle(s.cardIds);s.round=1;s.total=0;s.hits=0;s.results=[];s.roundStart=Object.fromEntries(scopeCards().map(c=>[c.id,0]));closeModal();nextQuestion();persist();render();}
      else if(a==='recover')download(corruptRaw,'learn-storage-recovery.json');
      else if(a==='reset-storage')confirmAction('Reset unreadable storage?','Download the saved data first if you need it. Reset replaces the unreadable data with this tab’s current library.','confirm-storage','Reset storage');
      else if(a==='confirm-storage'){corruptRaw=null;closeModal();persist('Storage reset');render();}
      else if(a==='reload')window.location.reload();
    }
    function saveOptions() {if(!document.getElementById('options-panel'))return;applyStudyOptions();closeModal();const stored=save();render();savedNotice(stored);}
    function checkWritten() {const input=document.getElementById('written-answer');if(input)submitAnswer(input.value);}
    function checkCorrection() {const input=document.getElementById('correction');if(input)correction(input.value);}
    function captureDraft(input) {if(state.session?.question){state.session.question.draft=input.value;save();}}
    function searchDecks(value) {search=value;filterDecks();}
    document.addEventListener('keydown',e=>{
      if(e.repeat||e.isComposing||$('#modal').open||page!=='study'||!state.session)return;
      const s=state.session,q=s.question,typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
      if(s.screen!=='question'){if(e.key==='Enter'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.target===document.body){e.preventDefault();(s.screen==='checkpoint'?$('#next-round'):null)?.click();}return;}
      if(e.altKey&&!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==='r'&&q.type==='written'&&q.phase==='incorrect'){e.preventDefault();override();return;}
      if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.target.id==='written-answer'&&q.phase==='asking'){e.preventDefault();checkWritten();return;}
      if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.target.id==='correction'&&q.phase==='incorrect'){e.preventDefault();checkCorrection();return;}
      if(e.ctrlKey||e.metaKey||e.altKey||typing)return;
      if(q.phase==='asking'&&q.type==='mc'&&/^[1-4]$/.test(e.key)){e.preventDefault();selectChoice(Number(e.key)-1);}
      else if(e.key==='Enter'&&q.phase==='correct'){e.preventDefault();advance();}
    });
    window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue!==JSON.stringify(state)){storageConflict=true;storageIssue='Your library changed in another tab. Export this tab if needed, then reload to use the latest saved library. Saving here is paused to prevent overwriting it.';renderBanner();}});
    window.addEventListener('pagehide',()=>{if('speechSynthesis' in window)window.speechSynthesis.cancel();});
    window.Learn={action,saveDeck,saveOptions,closeModal,showOptions,applyStudyOptions,applyImport,readImport,checkWritten,checkCorrection,captureDraft,searchDecks};
    render();
  })();
  </script>
  <div class="fixed bottom-4 right-4 z-50 px-3 py-1.5 rounded-full bg-gray-900/90 border border-gray-700 text-xs font-bold tracking-widest text-white shadow-lg pointer-events-none">
  ⚡ AKX
</div>
