    function swapEditorCards() {

    function deduplicateEditorCards() {
      if (!editor || !document.getElementById('deck-editor')) return;
      syncEditor();
      const keyPart = value => String(value).normalize('NFKC').toLocaleLowerCase().trim().replace(/\s+/gu,' ');
      const seen = new Map(), retained = [];
      let removed = 0;
      for (const card of editor.cards) {
        if (!card.term.trim() && !card.definition.trim()) {retained.push(card);continue;}
        const key = JSON.stringify([keyPart(card.term),keyPart(card.definition)]);
        const original = seen.get(key);
        if (original) {
          original.starred = original.starred || card.starred;
          removed++;
        } else {
          seen.set(key,card);
          retained.push(card);
        }
      }
      editor.cards = retained;
      editor.status = removed ? `${removed} duplicate ${removed === 1 ? 'card removed' : 'cards removed'}. First copies keep their progress. Save the deck to keep this change.` : 'No duplicate term and definition pairs found.';
      editor.statusError = false;
      sfx.click();
      renderEditor();
